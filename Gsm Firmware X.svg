<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Accent Gradient for GFX -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Container / App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6" />

  <!-- Geometric GFX Monogram Mark -->
  <g filter="url(#glow)">
    <!-- Stylized 'G' arc & bar -->
    <path d="M 210 160 H 140 C 105 160 80 185 80 220 V 292 C 80 327 105 352 140 352 H 200 C 235 352 250 327 250 292 V 260 H 175" 
          fill="none" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Sharp Tech 'F' -->
    <path d="M 285 352 V 160 H 375 M 285 250 H 350" 
          fill="none" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Dynamic Overlay 'X' -->
    <path d="M 370 200 L 445 352 M 445 200 L 370 352" 
          fill="none" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round" />
  </g>
</svg>
