<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #191919;
      --card-bg: #202020;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;
      --border-color: #2e2e2e;
      --accent: #2ea44f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 30px 15px;
      line-height: 1.6;
    }
    .post-wrapper {
      max-width: 850px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 35px;
    }
    .back-home {
      display: inline-block;
      margin-bottom: 20px;
      color: #888;
      text-decoration: none;
      font-size: 14px;
    }
    .back-home:hover { color: #fff; }
    h1 { font-size: 26px; margin-bottom: 12px; color: #fff; line-height: 1.3; }
    .post-date { font-size: 13px; color: var(--text-muted); margin-bottom: 25px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
    h2, h3 { margin-top: 25px; margin-bottom: 12px; color: #f0f0f0; }
    p { margin-bottom: 16px; color: #d0d0d0; }
    ul, ol { margin-left: 20px; margin-bottom: 16px; color: #d0d0d0; }
    li { margin-bottom: 8px; }
    
    /* Tables */
    table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 14px; }
    th, td { border: 1px solid var(--border-color); padding: 10px 14px; text-align: left; }
    th { background: #282828; color: #fff; }
    td { background: #1c1c1c; color: #ccc; }
    
    code { background: #2a2a2a; color: #4ade80; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="post-wrapper">
    <a href="{{ '/' | relative_url }}" class="back-home"><i class="fas fa-arrow-left"></i> Back to All Firmwares</a>
    <h1>{{ page.title }}</h1>
    <div class="post-date"><i class="far fa-calendar-alt"></i> {{ page.date | date: "%B %d, %Y" }} • Tested Firmware</div>
    <div class="post-body">
      {{ content }}
    </div>
  </div>
</body>
</html>
